services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poker_range_trainer
      POSTGRES_USER: poker_range_trainer
      POSTGRES_PASSWORD: poker_range_trainer_local
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poker_range_trainer -d poker_range_trainer']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
