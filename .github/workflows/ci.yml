# Lint, test and build both apps on every push and pull request - the same
# three commands the local validation gate runs, from the repo root (the root
# scripts drive the mobile app via --prefix; running them from mobile/ would
# silently run the mobile-only variants).
name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the repo is developed and validated on locally.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
