# Lint, test, and build every workspace on every push and pull request - the
# same commands the local validation gate runs, from the repo root (the root
# scripts drive the iOS client via --prefix; running them from mobile/
# would silently run the mobile-only variants). The integration suites need a
# real PostgreSQL, provided here as a service container.
name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: poker_range_trainer
          POSTGRES_USER: poker_range_trainer
          POSTGRES_PASSWORD: poker_range_trainer_local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U poker_range_trainer -d poker_range_trainer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://poker_range_trainer:poker_range_trainer_local@localhost:54329/poker_range_trainer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the repo is developed and validated on locally.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install iOS client dependencies
        run: npm ci --prefix mobile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
