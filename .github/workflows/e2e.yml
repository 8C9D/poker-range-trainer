# Browser tests against the production build behind TLS. A separate workflow from
# CI because they need browsers and read the database server's admin connection.
name: E2E

on:
  push:
  pull_request:

jobs:
  browsers:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://e2e@localhost:54329/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type-check the tests
        run: npm run build:packages && npm --workspace @poker-range-trainer/e2e run typecheck

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/e2e

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
