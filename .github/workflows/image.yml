# Builds the production image and proves it is a working release, and starts the
# development database from compose.yaml. Nothing is published.
name: Image

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --tag poker-range-trainer:smoke .

      - name: Smoke test
        run: scripts/smoke-image.sh poker-range-trainer:smoke

      - name: Start the development database
        run: |
          docker compose up --detach --wait
          docker compose exec --no-TTY postgres \
            psql --host 127.0.0.1 --username poker_range_trainer \
            --dbname poker_range_trainer --command 'select 1'
