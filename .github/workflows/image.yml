# Builds the production image and proves it is a working release. Nothing is
# published: this checks the Dockerfile on every push.
name: Image

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --tag poker-range-trainer:smoke .

      - name: Smoke test
        run: scripts/smoke-image.sh poker-range-trainer:smoke
